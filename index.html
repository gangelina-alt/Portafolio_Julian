<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preguntas Curiosas</title>
    <style>
        /* Estilos sencillos para que se vea ordenado y centrado */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #fa0000;
            text-align: center;
            padding: 50px;
        }
        .caja-pregunta {
            background: rgb(171, 0, 137);
            padding: 20px;
            margin: 15px auto;
            border-radius: 8px;
            max-width: 400px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
        input, select {
            padding: 8px;
            margin-top: 5px;
            width: 80%;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 15px;
            margin: 5px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .oculto {
            display: none;
        }
        #carita-triste {
            font-size: 50px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Cuestionario Rápido</h1>

    <!-- Pregunta 1: Nacionalidad -->
    <div class="caja-pregunta">
        <label for="nacionalidad">1. ¿Cuál es tu nacionalidad?</label><br>
        <input type="text" id="nacionalidad" placeholder="Ej. Chilena, Argentina...">
    </div>

    <!-- Pregunta 2: Gustos -->
    <div class="caja-pregunta">
        <label for="gustos">2. ¿Qué te gusta hacer en tu tiempo libre?</label><br>
        <input type="text" id="gustos" placeholder="Ej. Jugar videojuegos, programar...">
    </div>

    <!-- Pregunta 3: Programador -->
    <div class="caja-pregunta">
        <label>3. ¿Eres programador?</label><br><br>
        <button onclick="responderProgramador('si')">Sí</button>
        <button onclick="responderProgramador('no')">No</button>

        <!-- Sub-pregunta si dice que SÍ -->
        <div id="pregunta-bano" class="oculto">
            <p>¿Te bañas?</p>
            <button onclick="alert('¡Excelente, la higiene es clave! 🧼')">Sí</button>
            <button onclick="alert('Sospechoso... típico de programador 💻😂')">No</button>
        </div>

        <!-- Respuesta si dice que NO -->
        <div id="respuesta-no" class="oculto">
            <div id="carita-triste">😢</div>
            <p>¡Qué triste que no seas programador!</p>
        </div>
    </div>

    <!-- Script de JavaScript para la interactividad -->
    <script>
        function responderProgramador(opcion) {
            const preguntaBano = document.getElementById('pregunta-bano');
            const respuestaNo = document.getElementById('respuesta-no');

            if (opcion === 'si') {
                // Si es programador, muestra la pregunta del baño y oculta la carita triste
                preguntaBano.classList.remove('oculto');
                respuestaNo.classList.add('oculto');
            } else {
                // Si no es programador, muestra la carita triste y oculta la pregunta del baño
                respuestaNo.classList.remove('oculto');
                preguntaBano.classList.add('oculto');
            }
        }
    </script>

</body>
</html>
